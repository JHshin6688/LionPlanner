name: Run Data Pipeline

# Manual-trigger only: the default run (courses_semester.csv sync) is cheap since
# it's diff-checked against courses_total, but --backfill re-analyzes the entire
# catalog unconditionally, so this stays an explicit, occasional operation rather
# than something that fires on a schedule.
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "One-time bulk analysis of the full catalog (courses_total.csv) into an empty courses_total/review, instead of the regular semester sync"
        type: boolean
        default: false
      force_refresh:
        description: "Semester sync only: bypass the SHA-256 diff engine and reanalyze every course in courses_semester.csv"
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run pipeline
        run: python -m src.main ${{ inputs.backfill && '--backfill' || '' }} ${{ inputs.force_refresh && '--force-refresh' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          VOYAGE_EMBEDDING_MODEL: ${{ secrets.VOYAGE_EMBEDDING_MODEL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
