name: Run Data Pipeline

# Manual-trigger only for now: src/main.py currently reads src/data/courses_mini.csv,
# a local test file that isn't committed (blocked by .gitignore's `data/` rule).
# Once src/data/courses_total.csv is committed and src/main.py points to it,
# consider re-adding a `schedule:` trigger here for automatic re-runs.
on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Bypass the SHA-256 diff engine and reanalyze every course"
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run pipeline
        run: python -m src.main ${{ inputs.force_refresh && '--force-refresh' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          VOYAGE_EMBEDDING_MODEL: ${{ secrets.VOYAGE_EMBEDDING_MODEL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
